name: CLI Self-Hosted Tests

# Runs the CLI ./test suite against a throwaway backend booted on the runner,
# instead of the Infisical Cloud fixtures and long-lived credentials the
# upstream cli repo uses. The provision step creates hermetic fixtures and
# exports them as job environment; no Cloud account, no license key, and no
# CLI_TESTS_* secrets are required. Nothing here exercises enterprise
# features, so the community plan the throwaway backend runs under is enough.
#
# Triggering on backend/** as well as infisical-cli/** is deliberate: the
# suite builds and boots backend@HEAD, so it is also the CLI-vs-backend
# contract check for backend changes.

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "infisical-cli/**"
      - "backend/**"
      - "!backend/README.md"
      - "!backend/.*"
      - "build-versions.env"
      - ".github/workflows/run-cli-selfhosted-tests.yml"
  workflow_dispatch:

concurrency:
  group: cli-selfhosted-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli-selfhosted-tests:
    name: CLI tests (runner-booted backend)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # The provision step must outlive its own test process so the ./test
      # step can use the stack; the teardown step removes it afterwards.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      INFISICAL_BACKEND_DIR: ${{ github.workspace }}/backend
      INFISICAL_BACKEND_DOCKERFILE: Dockerfile.dev
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: infisical-cli/e2e/go.mod
          cache: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      - name: Boot backend and provision fixtures
        run: |
          cd infisical-cli/e2e
          PROVISION_ENV_OUT="$GITHUB_ENV" go test -count=1 -v -run TestProvisionCLIFixtures ./provision/

      - name: Run CLI tests
        run: |
          cd infisical-cli/test
          go test -count=1 -v ./...

      - name: Teardown backend
        if: always()
        run: |
          cd infisical-cli/e2e
          go test -count=1 -run TestTeardownCLIFixtures ./provision/
